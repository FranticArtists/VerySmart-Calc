<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Very Smart Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img id='logo' src="img/verysmart-calc-flat.svg" alt="VerySmart™ Calc logo">
    </header>

    <div id="wrapper">
        <section id="section1">
            <h2>Perform Basic Operations</h2>
            <fieldset>
                <legend>Enter machine number:</legend>
                <input id="firstNum" type="number" placeholder="First number">
                <select id="operation" name="operation">
                    <option id='additionOperator' value="addition">+</option>
                    <option id='subtractionOperator' value="subtraction">-</option>
                    <option id='multiplicationOperator' value="multiplication">*</option>
                    <option id='divisionOperator' value="division">/</option>
                </select>
                <input id="secondNum" type="number" placeholder="Second number" />
            </fieldset>
            <button id="submitBtn" type="submit">Submit</button>
            <section id="section2">
                <fieldset id='cedrick'>
                    <legend>Chop or round result:</legend>
                    <input id='chop' value='chop' name='ivanne' type="radio" checked>
                    <label for="chop">Chop</label>
                    <input id='round' value="round" name="ivanne" type="radio">
                    <label for="round">Round</label>
                </fieldset>
                <fieldset>
                    <label for="significantDigits">Number of significant digits:</label>
                    <input id='significantDigits' type="number" placeholder="2">
                </fieldset>
            </section>
            <button id="applyChopRoundBtn" type="submit">Apply Chop/Round</button>
            <div id="resultContainer">
                <p><strong>Result:</strong> <span id="result"></span></p>
                <p><strong>Absolute Error:</strong> <span id="absoluteErrorResult"></span></p>
                <p><strong>Relative Error:</strong> <span id="relativeErrorResult"></span></p>
                <p><strong>Maximum Error:</strong> <span id="maximumErrorResult"></span></p>
                <p><strong>Significant Digits:</strong> <span id="significantDigitsResult"></span></p>
            </div>
        </section>

        <section id="section3">
            <h2>Evaluate Polynomial Functions</h2>
            <fieldset>
                <div class="input-divs">
                    <label for="polynomialFunction">Enter polynomial function:</label> <br />
                    <input id='polynomialFunction' type="text">
                </div>
                <div class="input-divs">
                    <label for="polynomialVariable">Enter value of x:</label> <br />
                    <input id="polynomialVariable" type="number">
                </div>
            </fieldset>
            <button id="evaluatePolynomialBtn" type="submit">Evaluate</button>
            <div>
                <p>Result:</p>
                <p id="polynomialResult"></p>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js"></script>
</body>

</html>
